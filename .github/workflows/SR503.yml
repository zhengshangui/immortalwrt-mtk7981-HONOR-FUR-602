name: SR503

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      clean:
        description: 'clean ccache'
        type: boolean
        default: false

env:
  REPO_URL: https://github.com/bbb0bbb0bbb/immortalwrt-mt798x-24.10
  REPO_BRANCH: 2410
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ./doc/config/mt7981-ax3000-mtwifi-cfg.config
  DIY_P1_SH: ./doc/diy/diy-360T7-hanwckf-1.sh
  # DIY_P2_SH: ./doc/diy/diy-360T7-padavanonly-2.sh
  TZ: Asia/Shanghai
  
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      
    steps:
    - name: Checkout
      uses: actions/checkout@main
    
    - name: Prepare environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
         sudo apt-get update
         sudo apt-get install -y jq curl
         sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
         sudo timedatectl set-timezone "$TZ"
         sudo mkdir -p /workdir
         sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
         df -hT $PWD
         git clone $REPO_URL -b $REPO_BRANCH openwrt
         ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
    
    - name: Cache
      uses: klever1988/cachewrtbuild@main
      with:
         ccache: true
         mixkey: 'fur602-2410'
         toolchain: true
         skip: false
         clean: ${{ github.event.inputs.clean }}
         prefix: ${{ github.workspace }}/openwrt
           
    - name: Load custom feeds
      run: |
         # 1. 检查 feeds 配置文件是否存在
         if [ -f "$FEEDS_CONF" ]; then
             mv $FEEDS_CONF openwrt/feeds.conf.default
         else
             echo "⚠️ 未找到 $FEEDS_CONF，跳过替换。"
         fi
         
         # 2. 检查 DIY 脚本文件是否存在（针对之前的报错核心修复）
         if [ -f "$DIY_P1_SH" ]; then
             echo "✅ 找到 DIY 脚本: $DIY_P1_SH"
             chmod +x $DIY_P1_SH
             cd openwrt
             $GITHUB_WORKSPACE/$DIY_P1_SH
         else
             echo "⚠️ 警告：找不到 $DIY_P1_SH 文件！请检查文件是否已推送到仓库。"
             ls -la ./doc/diy/ # 打印目录内容以便排查
         fi

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a
      
    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
         # 1. 检查 files 目录是否存在
         if [ -d "files" ]; then
             echo "✅ 找到 files 目录，移动到 openwrt 中。"
             mv files openwrt/files
         else
             echo "⚠️ 警告：未找到 files 目录，跳过。"
         fi
         
         # 2. 检查 .config 配置文件是否存在
         if [ -f "$CONFIG_FILE" ]; then
             echo "✅ 找到配置文件: $CONFIG_FILE"
             mv $CONFIG_FILE openwrt/.config
         else
             echo "⚠️ 警告：找不到 $CONFIG_FILE 文件！将使用默认配置编译。"
             ls -la ./doc/config/ # 打印目录内容以便排查
         fi

    - name: Download package
      id: package
      run: |
         cd openwrt
         make defconfig
         make download -j8
         find dl -size -1024c -exec ls -l {} \;
         find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
         cd openwrt
         echo -e "$(nproc) thread compile"
         make -j$(nproc) || make -j1 V=s
         echo "release_tag=FUR602-SR503-2410-$(date +%Y.%m.%d)" >> $GITHUB_ENV
         echo "release_name=FUR602-SR503-ImmortalWrt-24.10" >> $GITHUB_ENV
         echo "status=success" >> $GITHUB_OUTPUT

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && !cancelled()
      with:
         name: ${{ env.release_tag }}
         path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
         tar -cvf openwrt/bin/targets/mediatek/mt7981/packages.tar openwrt/bin/packages
         cd openwrt/bin/targets/mediatek/mt7981
         rm -rf packages
         rm -rf feeds.buildinfo
         rm -rf sha256sums
         rm -rf version.buildinfo
         rm -rf *kernel.bin
         rm -rf *manifest
         rm -rf *tar.bz2
         echo "FIRMWARE=$PWD" >> $GITHUB_ENV
         echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
         name: ${{ env.release_name }}
         tag_name: ${{ env.release_tag }}
         body: |
             Gateway：192.168.1.1
             Password：
             Model show：RuiJie SR503
             Chip: MT7981 FUR602
         files: ${{ env.FIRMWARE }}/*

    - name: Delete older releases
      uses: dev-drprasad/delete-older-releases@v0.3.3
      with:
        keep_latest: 3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
